name: First-party Windows plugins
on:
  push:
    branches: [feat/first-party-plugins, feat/first-party-102]
    tags: ['first-party-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: first-party
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: cargo generate-lockfile
      - run: cargo build --release --locked
      - run: cargo test --locked
      - name: Sample runner metrics for real system-monitor previews
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'").PercentProcessorTime
          $mem = Get-CimInstance Win32_OperatingSystem
          if ($null -ne $cpu) { "NOVYDECK_PREVIEW_CPU=$([math]::Round($cpu))" >> $env:GITHUB_ENV }
          if ($mem.TotalVisibleMemorySize -gt 0) {
            $used = 100 * (1 - $mem.FreePhysicalMemory / $mem.TotalVisibleMemorySize)
            "NOVYDECK_PREVIEW_RAM=$([math]::Round($used))" >> $env:GITHUB_ENV
          }
      - run: cargo run --release --locked --bin render-previews
      - run: python tools/make_icons.py
      - run: python tools/capture_inspectors.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-party-windows
          path: |
            first-party/dist/*.streamDeckPlugin
            first-party/dist/SHA256SUMS.txt
            first-party/previews/*.png
            first-party/inspector-previews/*.png
  release:
    if: startsWith(github.ref, 'refs/tags/first-party-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: first-party-windows
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist/*.streamDeckPlugin
            artifacts/dist/SHA256SUMS.txt
