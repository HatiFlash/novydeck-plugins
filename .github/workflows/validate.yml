name: Validate community registry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py --download
  signature:
    # S-02 : NovyDeck 0.19.3+ refuse un catalogue dont la signature ne correspond pas.
    # Sur une PR qui modifie registry.json, l'échec signale que le mainteneur doit re-signer avant fusion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/verify-registry-signature.sh
