[package]
name = "novydeck-googleassistant"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
novydeck-sdk.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport", "tls", "tls-webpki-roots"] }
prost = "0.13"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
url = "2"
