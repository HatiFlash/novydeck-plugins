<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Assistant</title><link rel="stylesheet" href="inspector.css">
<h1>Google Assistant</h1><h2 data-i18n="subtitle"></h2><p data-i18n="intro"></p><section class="card"><h2 data-i18n="setup"></h2><ol><li><span data-i18n="s1"></span> <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a>.</li><li data-i18n="s2"></li><li data-i18n="s3"></li><li data-i18n="s4"></li><li data-i18n="s5"></li><li data-i18n="s6"></li></ol><div class="field"><label for="file" data-i18n="file"></label><input id="file" type="file" accept=".json,application/json" hidden><button id="chooseFile" type="button" data-i18n="chooseFile"></button><span id="fileName" role="status"></span><small data-i18n="fileHelp"></small></div><div class="toolbar"><button id="connect" type="button" data-i18n="connect"></button><button id="disconnect" type="button" class="secondary" data-i18n="disconnect"></button></div><small id="status"></small></section>
<section class="card"><h2 data-i18n="command"></h2><div class="field"><label for="phrase" data-i18n="phrase"></label><input id="phrase" maxlength="500"></div><div class="field"><label for="language" data-i18n="language"></label><input id="language" maxlength="20" value="fr-FR"></div><button id="test" type="button" data-i18n="test"></button><small data-i18n="warning"></small></section><div id="message" role="status"></div>
<script>
const copy={en:{subtitle:'Action settings',intro:'Send a typed command when you press the key. This is a separate Assistant SDK option, not the direct device/room control in Google Home.',setup:'Connect your account',s1:'Create a project in',s2:'Enable Google Assistant API.',s3:'Configure OAuth consent in Testing mode and add your email as a test user.',s4:'Create OAuth Desktop application credentials.',s5:'Download the client JSON and import it here.',s6:'Connect, authorize access, then set your command.',file:'OAuth client JSON',chooseFile:'Import JSON…',noFile:'No file',fileHelp:'Imported locally; never stored in the action settings.',connect:'Connect to Google',disconnect:'Disconnect',offline:'Not connected',online:'Connected (email unknown)',command:'Voice command',phrase:'Phrase',language:'Language (locale)',test:'Test',warning:'Prototype API may stop working; quota and a Google account are required. Audio-only reply is discarded; OK does not confirm the physical device changed state.',invalid:'Invalid action info',large:'JSON file too large (64 KB maximum).',saved:'Saved'},fr:{subtitle:'Réglages de l’action',intro:'Envoyez une commande écrite en appuyant sur la touche. Cette voie Assistant SDK est distincte du pilotage direct des pièces et appareils Google Home.',setup:'Connecter votre compte',s1:'Créer un projet dans',s2:'Activer Google Assistant API.',s3:'Configurer le consentement OAuth en mode Test et ajouter votre adresse comme utilisateur de test.',s4:'Créer des identifiants OAuth « Application de bureau ».',s5:'Télécharger le JSON client et l’importer ici.',s6:'Se connecter, autoriser l’accès puis régler la commande.',file:'JSON client OAuth',chooseFile:'Importer le JSON…',noFile:'Aucun fichier',fileHelp:'Importé localement ; jamais stocké dans les réglages de l’action.',connect:'Se connecter à Google',disconnect:'Déconnecter',offline:'Non connecté',online:'Connecté (adresse inconnue)',command:'Commande vocale',phrase:'Phrase',language:'Langue (locale)',test:'Tester',warning:'Prototype : l’API peut cesser de fonctionner ; quotas et compte Google requis. Réponse audio non lue ici ; un statut OK ne confirme pas l’action physique.',invalid:'Informations de l’action invalides',large:'Fichier JSON trop grand (64 Ko maximum).',saved:'Enregistré'}};
let ws,context,settings={},lang='en',noticeTimer;const $=id=>document.getElementById(id);
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);$('status').textContent=copy[lang].offline;$('fileName').textContent=$('file').files?.[0]?.name||copy[lang].noFile;}
function emit(type,extra={}){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'sendToPlugin',context,payload:{type,...extra}}));}
function fill(){$('phrase').value=settings.phrase||'';$('language').value=settings.language||'fr-FR';}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(e){$('message').textContent=copy[lang].invalid;}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));emit('status');};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'){if(m.payload?.type==='status'){$('status').textContent=m.payload.connected?copy[lang].online:copy[lang].offline;$('connect').disabled=!!m.payload.pending;}if(m.payload?.type==='message')$('message').textContent=m.payload.message||'';}};}
function save(){settings={phrase:$('phrase').value,language:$('language').value};if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));$('message').textContent=copy[lang].saved;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('message').textContent='',2500);}}
for(const k of ['phrase','language'])$(k).addEventListener('change',save);
$('chooseFile').onclick=()=>$('file').click();
$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;$('fileName').textContent=file.name;if(file.size>65536){$('message').textContent=copy[lang].large;e.target.value='';return;}emit('import',{json:await file.text()});e.target.value='';});
$('connect').onclick=()=>emit('connect');$('disconnect').onclick=()=>emit('disconnect');$('test').onclick=()=>{save();emit('test');};translate();
</script></html>
