<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="inspector.css"><h1>Wallpaper Engine</h1><p data-i18n="intro"></p><section class="card"><h2 data-i18n="setup"></h2><label for="executable" data-i18n="exe"></label><input id="executable" placeholder="C:\Program Files (x86)\Steam\steamapps\common\wallpaper_engine\wallpaper64.exe"><small data-i18n="exeHelp"></small></section><section class="card" id="specific"><h2 data-i18n="source"></h2><div id="fileField"><label for="file" data-i18n="file"></label><input id="file" placeholder="C:\Wallpapers\project.json"><small data-i18n="fileHelp"></small></div><div id="playlistField"><label for="playlist" data-i18n="playlist"></label><input id="playlist"></div><div id="profileField"><label for="profile" data-i18n="profile"></label><input id="profile"></div><div id="targetField"><label for="target" data-i18n="screen"></label><select id="target"><option value="monitor" data-i18n="screenNumber"></option><option value="location" data-i18n="screenId"></option></select><div id="monitorField"><label for="monitor" data-i18n="number"></label><input id="monitor" type="number" min="1" max="32" value="1"><small data-i18n="numberHelp"></small></div><div id="locationField"><label for="location" data-i18n="location"></label><input id="location"><small data-i18n="locationHelp"></small></div></div></section><p id="global" data-i18n="global"></p><div id="message" role="status"></div><script>
const copy={en:{intro:'Use the official command line of your installed Wallpaper Engine (Steam). Create playlists and profiles in Wallpaper Engine first.',setup:'Application',exe:'Executable (optional)',exeHelp:'Automatically searches standard Steam folders. For a custom Steam library, browse to wallpaper32.exe or wallpaper64.exe and paste its full path. Wallpaper Engine must already be running.',source:'Action settings',file:'Wallpaper project or media file',fileHelp:'Use the full path to project.json, a supported video, image, or other supported media. The file must exist locally.',playlist:'Saved playlist name',profile:'Saved display profile name',screen:'Screen selection',screenNumber:'Screen number',screenId:'Internal screen ID',number:'Screen number (starting at 1)',numberHelp:'Screen 1 = Wallpaper Engine monitor index 0.',location:'Internal monitor ID',locationHelp:'Find the location value in Wallpaper Engine config.json for your PC.',global:'This command affects all screens. Play, pause, stop, mute and unmute are global; a saved profile also applies to every screen.'},fr:{intro:'Utilise les commandes officielles de Wallpaper Engine installé via Steam. Créez d’abord vos playlists et profils dans Wallpaper Engine.',setup:'Application',exe:'Exécutable (facultatif)',exeHelp:'Recherche automatique dans les dossiers Steam standard. Pour une bibliothèque personnalisée, indiquez le chemin complet de wallpaper32.exe ou wallpaper64.exe. Wallpaper Engine doit déjà fonctionner.',source:'Réglages de l’action',file:'Fichier de fond ou projet',fileHelp:'Chemin complet de project.json, vidéo, image ou autre média pris en charge. Le fichier doit exister sur ce PC.',playlist:'Nom de playlist enregistrée',profile:'Nom de profil d’affichage enregistré',screen:'Choix de l’écran',screenNumber:'Numéro d’écran',screenId:'Identifiant interne',number:'Numéro d’écran (dès 1)',numberHelp:'Écran 1 = index 0 pour Wallpaper Engine.',location:'Identifiant interne de l’écran',locationHelp:'Retrouvez la valeur location dans config.json de Wallpaper Engine.',global:'Commande globale sur tous les écrans. Lecture, pause, arrêt, muet et son ne se ciblent pas par écran ; un profil enregistré s’applique également partout.'}};
let lang='en',ws,context,settings={},action='';const $=id=>document.getElementById(id);function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=copy[lang][e.dataset.i18n]);}function visible(){for(let k of ['file','playlist','profile'])$(k+'Field').hidden=action!==({file:'wallpaper',playlist:'playlist',profile:'profile'}[k]);$('targetField').hidden=!['wallpaper','playlist','next'].includes(action);$('global').hidden=!['profile','pause','play','stop','mute','unmute'].includes(action);$('monitorField').hidden=$('target').value!=='monitor';$('locationField').hidden=$('target').value!=='location';$('specific').hidden=['pause','play','stop','mute','unmute'].includes(action);}function fill(){for(let k of ['executable','file','playlist','profile','location'])$(k).value=settings[k]||'';$('target').value=settings.target||'monitor';$('monitor').value=(Number.isInteger(settings.monitor)?settings.monitor:0)+1;visible();}function save(){settings={executable:$('executable').value,file:$('file').value,playlist:$('playlist').value,profile:$('profile').value,target:$('target').value,monitor:Number($('monitor').value)-1,location:$('location').value};if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));visible();}function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en'}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};action=a.action?.split('.').pop()||''}catch(_){}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}))};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill()}if(m.event==='sendToPropertyInspector')$('message').textContent=m.payload?.message||''};}for(let k of ['executable','file','playlist','profile','target','monitor','location'])$(k).addEventListener('change',save);translate();visible();
</script></html>
