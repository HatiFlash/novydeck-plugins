function fill(){for(const key of keyFields){if(settings[key]===undefined)continue;const el=$(key);if(el.type==='checkbox')el.checked=!!settings[key];else el.value=settings[key];}if(!$('op').value)$('op').value='eq';if(action===AUTO)kind='entity';else if(settings.group)kind='group';else if(!(kind==='group'&&!$('group').value))kind='entity';renderGroups();renderTarget();detect();renderPresets();suggest();}

function renderParam(p){const box=$('paramField');if(!p||!p.param){box.hidden=true;box.replaceChildren();return;}if(box.contains(document.activeElement))return;const q=p.param,b=bounds();box.hidden=false;box.replaceChildren();const lab=document.createElement('label');lab.htmlFor='param';lab.textContent=q.label[lang]||q.label.en;box.append(lab);let el;const list=q.type==='choice'?choices(q):[];if(q.type==='choice'&&list.length){el=document.createElement('select');const all=list.slice();if(pvalue&&!all.includes(pvalue))all.push(pvalue);for(const v of all){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o);}el.value=pvalue||all[0];}else if(q.type==='choice'){el=document.createElement('input');el.type='text';el.maxLength=128;el.value=pvalue||'';}else{el=document.createElement('input');el.type='number';el.step=q.step||1;const lo=q.boundsFrom&&b&&Number.isFinite(b.min)?b.min:q.min,hi=q.boundsFrom&&b&&Number.isFinite(b.max)?b.max:q.max;if(lo!==undefined)el.min=lo;if(hi!==undefined)el.max=hi;el.value=pvalue===null||pvalue===undefined?'':pvalue;}el.id='param';el.setAttribute('aria-describedby','paramError');el.addEventListener('change',onParam);box.append(el);const err=document.createElement('div');err.id='paramError';err.className='error';err.setAttribute('role','alert');box.append(err);}

function pickPreset(){const v=$('preset').value;if(!v)return;if(v===CUSTOM){forcedCustom=true;sel=CUSTOM;pvalue=null;renderPresets();return;}const p=findPreset(v);if(!p)return;forcedCustom=false;sel=p.id;pvalue=defaultValue(p);const out=H.build(p,pvalue,bounds());renderPresets();if(out){applyBuilt(out);save();}else{const e=$('paramError');if(e)e.textContent=t('presetNeed');}}
function onParam(){const p=findPreset(sel);if(!p||!p.param)return;const el=$('param'),e=$('paramError'),v=H.validate(p,el.value,bounds());if(v===null){const q=p.param,b=bounds();const lo=q.boundsFrom&&b&&Number.isFinite(b.min)?b.min:q.min,hi=q.boundsFrom&&b&&Number.isFinite(b.max)?b.max:q.max;e.textContent=q.type==='choice'||lo===undefined||hi===undefined?t('presetNeed'):t('presetRange').replace('{min}',lo).replace('{max}',hi)+(q.int?' ('+t('presetWhole')+')':'');return;}e.textContent='';pvalue=v;applyBuilt(H.build(p,v,bounds()));save();}
function onEntity(){if(action===TOG){const before=lastDom,dom=entDom();if(dom!==before||!sel){lastDom=dom;const p=presetList()[0]||null;sel=p?p.id:'';pvalue=p?defaultValue(p):null;const out=p&&H.build(p,pvalue,bounds());if(out)applyBuilt(out);}renderPresets();return;}const before=lastDom,wasAuto=!forcedCustom&&(H.isEmpty(...cur())||!!H.match(before,...cur()));forcedCustom=false;const dom=entDom();if(dom===before){detect();renderPresets();return;}if(presetList().length&&!H.match(dom,...cur())&&wasAuto){const p=H.first(dom),v=p&&defaultValue(p),out=p&&H.build(p,v,bounds());if(out)applyBuilt(out);}detect();renderPresets();}
function gname(id){const it=items.find(i=>i.id===id);return it?it.name:id;}
function renderTarget(){const g=kind==='group'&&action!==AUTO;$('targetKind').value=g?'group':'entity';$('groupBox').hidden=!g;$('entityField').hidden=g;$('results').hidden=g&&!editing;if(!g&&editing)closeEditor();if(g){$('gEdit').disabled=!curGroup();$('gDelete').disabled=!curGroup();$('gHint').hidden=!!editing;}renderMembers();}
function curGroup(){return groups.find(x=>x.id===$('group').value)||null;}
function renderGroups(){const sel=$('group'),want=sel.value&&Array.from(sel.options).some(o=>o.value===sel.value)?sel.value:(settings.group||'');sel.replaceChildren();const add=(v,txt)=>{const o=document.createElement('option');o.value=v;o.textContent=txt;sel.append(o);};add('',t('gPick'));for(const x of groups)add(x.id,x.name);if(want&&!groups.some(x=>x.id===want))add(want,t('gMissing'));sel.value=want;renderMembers();}
function renderMembers(){const g=curGroup(),m=$('gMembers');m.textContent=g?t('gMembers')+' : '+g.entities.map(gname).join(', '):'';if(!$('groupBox').hidden){$('gEdit').disabled=!g;$('gDelete').disabled=!g;}}
function openEditor(g){editing={id:g?g.id:'',members:g?g.entities.slice():[]};$('gName').value=g?g.name:'';$('gError').textContent='';$('groupEditor').hidden=false;$('gHint').hidden=true;renderEditor();display();$('gName').focus();}
function closeEditor(){editing=null;saving=false;$('groupEditor').hidden=true;$('gError').textContent='';if(kind==='group')$('gHint').hidden=false;$('gSelected').replaceChildren();display();}
function renderEditor(){if(!editing)return;$('gCount').textContent=t('gCount').replace('{n}',editing.members.length);const box=$('gSelected');box.replaceChildren();for(const id of editing.members){const row=document.createElement('div');row.className='toolbar';const l=document.createElement('span');l.textContent=gname(id)+' ('+id+')';const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='−';b.title=t('gRemove');b.setAttribute('aria-label',t('gRemove')+' '+gname(id));b.onclick=()=>toggleMember(id);row.append(l,b);box.append(row);}}
function toggleMember(id){if(!editing)return;const i=editing.members.indexOf(id);if(i>=0)editing.members.splice(i,1);else if(editing.members.length<50)editing.members.push(id);renderEditor();display();}
function addAll(){if(!editing)return;const q=norm($('search').value).trim(),dom=$('filter').value;for(const it of items){if(dom&&(it.domain||it.id.split('.')[0])!==dom)continue;if(q&&!norm(it.id+' '+it.name).includes(q))continue;if(editing.members.length>=50)break;if(!editing.members.includes(it.id))editing.members.push(it.id);}renderEditor();display();}
function saveGroup(){if(!editing)return;const name=$('gName').value.trim();if(!name){$('gError').textContent=t('gNeedName');return;}$('gError').textContent='';saving=true;send('sendToPlugin',{op:'saveGroup',id:editing.id,name,entities:editing.members});}
function pickGroup(){onEntity();renderMembers();renderTarget();save();}
function groupsReply(p){groups=Array.isArray(p.groups)?p.groups:[];if(p.error){if(editing)$('gError').textContent=p.error;else flash(p.error);saving=false;return;}const wanted=saving&&p.saved;renderGroups();if(wanted){$('group').value=p.saved;closeEditor();pickGroup();}else{renderTarget();}}
function choose(it){$('entity').value=it.id;onEntity();if(action===AUTO&&!$('value').value&&!$('attribute').value&&it.state)$('value').value=it.state;suggest();display();save();}
function suggest(){const dl=$('values');dl.replaceChildren();const it=items.find(i=>i.id===$('entity').value),cur=$('current');cur.textContent='';if(!it)return;const set=new Set();if(!$('attribute').value.trim()){const bin=['on','off'];if(['light','switch','fan','input_boolean','binary_sensor','automation','group'].includes(it.domain)||bin.includes(it.state)){bin.forEach(v=>set.add(v));}if(it.domain==='cover'||it.domain==='lock'||it.domain==='media_player'||it.domain==='person'||it.domain==='device_tracker'){['open','closed','locked','unlocked','playing','paused','idle','home','not_home'].forEach(v=>set.add(v));}if(it.state)set.add(it.state);set.add('unavailable');cur.textContent=t('now')+' : '+it.state+(it.unit?' '+it.unit:'');}for(const v of set){const o=document.createElement('option');o.value=v;dl.append(o);}}
function status(p){stat=p;connected=!!p.connected;if(p.url!==undefined&&document.activeElement!==$('url'))$('url').value=p.url||'';if(p.insecure!==undefined)$('insecure').checked=!!p.insecure;renderStatus();warnings();if(connected&&!items.length)send('sendToPlugin',{op:'list'});if(!connected){items=[];listMsg='';}display();}
function isLocalHost(h){h=String(h||'').trim().replace(/^\[|\]$/g,'').replace(/\.$/,'').toLowerCase();if(!h)return false;let m=h.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);if(m){const a=+m[1],b=+m[2];return a===127||a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168)||(a===169&&b===254);}if(h.includes(':')){const f=parseInt(h.split(':')[0]||'0',16);const mapped=h.match(/^::ffff:(\d+\.\d+\.\d+\.\d+)$/);if(mapped)return isLocalHost(mapped[1]);return h==='::1'||(f&0xfe00)===0xfc00||(f&0xffc0)===0xfe80;}return !h.includes('.')||/\.(local|lan)$/.test(h)||h.endsWith('.home.arpa');}
function parseUrl(v){try{return new URL(String(v).trim());}catch(_){return null;}}
function warnings(){const u=parseUrl($('url').value),clear=!!u&&/^(http|ws):$/.test(u.protocol),local=!!u&&isLocalHost(u.hostname);const w=$('urlWarn');w.textContent=clear?(local?t('clearLocal'):t('clearPublic')):'';w.className=clear&&!local?'warn':'hint';const bad=$('insecure').checked&&!!u&&!local;$('insecureWarn').textContent=bad?t('insecureNonLocal'):'';if($('insecure').checked)$('advanced').open=true;const tw=$('tokenWarn');tw.textContent=stat&&stat.tokenMismatch?t('reenter')+' — '+t('st_token_mismatch'):'';const sg=$('suggest');sg.replaceChildren();if(stat&&stat.suggestion){const s=document.createElement('span');s.textContent=t('suggestion')+' '+stat.suggestion.url+' ';const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=t('use');b.onclick=()=>{$('url').value=stat.suggestion.url;$('insecure').checked=!!stat.suggestion.insecure;warnings();};sg.append(s,b);}}
function connPayload(){return{url:$('url').value.trim(),insecure:$('insecure').checked};}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}try{const a=JSON.parse(actionInfo);context=a.context;action=a.action||'';settings=a.payload?.settings||{};}catch(_){translate();$('notice').textContent=t('missing');return;}layout();translate();fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('getSettings');send('sendToPlugin',{op:'status'});send('sendToPlugin',{op:'groups'});send('sendToPlugin',{op:'list'});};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'){const p=m.payload||{};if(p.type==='status'){status(p);}if(p.type==='list'){if(p.status==='ok'){items=Array.isArray(p.entities)?p.entities:[];connected=true;listMsg='';}else{items=[];connected=false;listMsg=p.message||'';}renderFilter();display();suggest();renderPresets();}if(p.type==='groups')groupsReply(p);if(p.type==='test')flash(p.ok?t('success')+(p.count!==undefined?' ('+p.count+')':''):(p.message||t('error')));if(p.type==='error')flash(p.message||t('error'));}};}
for(const key of keyFields)if(key!=='entity')$(key).addEventListener('change',save);
$('entity').addEventListener('change',()=>{onEntity();save();});$('preset').addEventListener('change',pickPreset);
$('targetKind').addEventListener('change',()=>{kind=$('targetKind').value;if(kind==='entity'&&editing)closeEditor();onEntity();renderTarget();if(kind==='entity')save();});$('group').addEventListener('change',pickGroup);$('gNew').onclick=()=>openEditor(null);$('gEdit').onclick=()=>{const g=curGroup();if(g)openEditor(g);};$('gSave').onclick=saveGroup;$('gCancel').onclick=closeEditor;$('gAll').onclick=addAll;
$('gDelete').onclick=()=>{const g=curGroup();if(!g)return;if(!delArmed){delArmed=true;$('gDelete').textContent=t('gConfirm');clearTimeout(delTimer);delTimer=setTimeout(()=>{delArmed=false;$('gDelete').textContent=t('gDelete');},4000);return;}delArmed=false;clearTimeout(delTimer);$('gDelete').textContent=t('gDelete');send('sendToPlugin',{op:'deleteGroup',id:g.id});flash(t('gDeleted'));};
$('entity').addEventListener('input',()=>{suggest();display();});$('attribute').addEventListener('input',suggest);
$('save').onclick=()=>{const token=$('token').value.trim();$('token').value='';const p={op:'saveConnection',...connPayload()};if(token)p.token=token;send('sendToPlugin',p);items=[];flash(t('requested'));setTimeout(()=>send('sendToPlugin',{op:'list'}),1500);};
$('test').onclick=()=>{const p={op:'test',...connPayload()},tk=$('token').value.trim();if(tk)p.token=tk;send('sendToPlugin',p);};$('url').addEventListener('input',warnings);$('insecure').addEventListener('change',warnings);
$('list').onclick=()=>send('sendToPlugin',{op:'list'});$('filter').onchange=display;$('search').oninput=display;
translate();
</script></html>
