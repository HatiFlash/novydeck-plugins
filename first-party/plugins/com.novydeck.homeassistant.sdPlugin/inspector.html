<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Assistant</title><link rel="stylesheet" href="inspector.css">
<h1>Home Assistant</h1><h2 data-i18n="subtitle"></h2>
<section class="card"><h2 data-i18n="connection"></h2><div class="field"><label for="url" data-i18n="url"></label><input id="url" placeholder="http://homeassistant.local:8123"><small data-i18n="globalHelp"></small></div><div class="field"><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off" data-i18n-ph="tokenPh"><small data-i18n="tokenHelp"></small></div><div class="field"><label class="switch"><input id="insecure" type="checkbox"><span data-i18n="insecure"></span></label><small data-i18n="insecureHelp"></small></div><div class="toolbar"><button id="save" type="button" data-i18n="saveConn"></button><button id="test" type="button" class="secondary" data-i18n="test"></button></div><small id="status" role="status"></small></section>
<section class="card"><h2 data-i18n="entitiesTitle"></h2><div id="listMsg" class="hint" role="status"></div><div class="field"><label for="filter" data-i18n="filter"></label><select id="filter"><option value="" data-i18n="all"></option></select></div><div class="field"><label for="search" data-i18n="search"></label><input id="search" type="search" autocomplete="off" data-i18n-ph="searchPh"></div><div id="results" class="results" role="listbox" tabindex="-1"></div><div class="toolbar"><button id="list" type="button" class="secondary" data-i18n="list"></button></div><div class="field"><label for="entity" data-i18n="entity"></label><input id="entity" placeholder="light.salon"><small data-i18n="manual"></small></div></section>
<section class="card" id="autoCard" hidden><h2 data-i18n="ruleTitle"></h2><small data-i18n="ruleHelp"></small><div class="field"><label for="attribute" data-i18n="attribute"></label><input id="attribute" placeholder="brightness"><small data-i18n="attributeHelp"></small></div><div class="field"><label for="op" data-i18n="op"></label><select id="op"><option value="eq" data-i18n="opEq"></option><option value="ne" data-i18n="opNe"></option><option value="gt" data-i18n="opGt"></option><option value="lt" data-i18n="opLt"></option></select></div><div class="field"><label for="value" data-i18n="value"></label><input id="value" list="values" autocomplete="off" placeholder="on"><datalist id="values"></datalist><small id="current"></small></div><div class="field"><label for="hold_seconds" data-i18n="hold"></label><input id="hold_seconds" type="number" min="0" max="86400" step="1" value="0"><div id="holdError" class="error" role="alert"></div><small data-i18n="holdHelp"></small></div><div class="field"><label class="switch"><input id="fire_at_start" type="checkbox"><span data-i18n="fireStart"></span></label><small data-i18n="fireStartHelp"></small></div></section>
<section class="card" id="serviceCard"><h2 data-i18n="serviceTitle"></h2><div class="field"><label for="domain" data-i18n="domain"></label><input id="domain" placeholder="light"></div><div class="field"><label for="service" data-i18n="service"></label><input id="service" placeholder="turn_on"></div><div class="field"><label for="data" data-i18n="data"></label><textarea id="data" rows="4" placeholder='{"brightness": 128}'></textarea></div><div class="field" id="refreshField"><label for="refresh" data-i18n="refresh"></label><input id="refresh" type="number" min="2" max="300" step="1" value="10"><div id="error" class="error" role="alert"></div></div><small data-i18n="serviceHelp"></small></section><div id="notice" role="status"></div>
<script>
const copy={en:{subtitle:'Action settings',connection:'Connection (shared by all keys)',url:'Home Assistant address',globalHelp:'Stored once for the whole plugin, not in NovyDeck preferences.',token:'Long-lived access token',tokenPh:'Paste a new token to replace it',tokenHelp:'Encrypted under your Windows account. Never displayed again.',saveConn:'Save connection',test:'Test connection',insecure:'Allow self-signed certificates',insecureHelp:'Unsafe: disables TLS certificate validation.',entitiesTitle:'Entities',filter:'Domain filter',all:'All domains',list:'Reload entities',search:'Search',searchPh:'Name or entity_id',entity:'Entity ID',manual:'Click a result above, or enter an ID manually.',serviceTitle:'Call a service',domain:'Service domain',service:'Service',data:'Service data (JSON object)',refresh:'Refresh interval (seconds)',serviceHelp:'Service fields apply to the “Call service” action. Test checks GET /api/.',invalid:'Enter a whole number from 2 to 300.',invalidHold:'Enter a whole number from 0 to 86400.',missing:'Configuration unavailable',connected:'Connected',offline:'Not configured',hasToken:'Token saved',noToken:'Token missing or unreadable',success:'Connection successful',error:'Error',entitiesLoaded:'entities',requested:'Connection saved',saved:'Saved',noMatch:'No entity matches.',now:'Current state',selected:'Selected',ruleTitle:'Automatic state rule',ruleHelp:'The key is active while the condition holds. NovyDeck 0.19.1 or later is required to use “Automatic state” and the Workshop block.',attribute:'Attribute (optional)',attributeHelp:'Empty = compare the entity state.',op:'Operator',opEq:'Equals',opNe:'Not equal to',opGt:'Greater than (>)',opLt:'Less than (<)',value:'Value',hold:'For at least (seconds)',holdHelp:'0 = immediately. The key becomes active only if the condition holds this long.',fireStart:'Also trigger at startup',fireStartHelp:'Run the “becomes active” branch if the rule is already true on start.',st_not_configured:'Not configured. Enter the Home Assistant address and token above, then save.',st_no_token:'Token missing. Enter a long-lived access token above, then save.',st_auth_failed:'Authentication failed. Check the access token.',st_reconnecting:'Disconnected from Home Assistant, reconnecting…',st_connecting:'Connecting to Home Assistant…',st_error:'Entity list unavailable.'},fr:{subtitle:'Réglages de l’action',connection:'Connexion (commune à toutes les touches)',url:'Adresse Home Assistant',globalHelp:'Enregistrée une fois pour tout le plugin, pas dans les préférences de NovyDeck.',token:'Jeton d’accès longue durée',tokenPh:'Collez un nouveau jeton pour le remplacer',tokenHelp:'Chiffré sous votre compte Windows. Jamais réaffiché.',saveConn:'Enregistrer la connexion',test:'Tester la connexion',insecure:'Accepter les certificats auto-signés',insecureHelp:'Dangereux : désactive la vérification TLS.',entitiesTitle:'Entités',filter:'Filtre de domaine',all:'Tous les domaines',list:'Recharger les entités',search:'Rechercher',searchPh:'Nom ou entity_id',entity:'ID de l’entité',manual:'Cliquez un résultat ci-dessus, ou saisissez un ID manuellement.',serviceTitle:'Appeler un service',domain:'Domaine du service',service:'Service',data:'Données du service (objet JSON)',refresh:'Actualisation (secondes)',serviceHelp:'Les champs service concernent l’action « Appeler un service ». Tester vérifie GET /api/.',invalid:'Saisissez un entier entre 2 et 300.',invalidHold:'Saisissez un entier entre 0 et 86400.',missing:'Configuration indisponible',connected:'Connecté',offline:'Non configuré',hasToken:'Jeton enregistré',noToken:'Jeton absent ou non lisible',success:'Connexion réussie',error:'Erreur',entitiesLoaded:'entités',requested:'Connexion enregistrée',saved:'Enregistré',noMatch:'Aucune entité ne correspond.',now:'État actuel',selected:'Sélectionnée',ruleTitle:'Règle d’état automatique',ruleHelp:'La touche est active tant que la condition est vraie. NovyDeck 0.19.1 ou plus récent est requis pour « État automatique » et le bloc de l’Atelier.',attribute:'Attribut (facultatif)',attributeHelp:'Vide = comparer l’état de l’entité.',op:'Opérateur',opEq:'Égal à',opNe:'Différent de',opGt:'Supérieur à (>)',opLt:'Inférieur à (<)',value:'Valeur',hold:'Depuis au moins (secondes)',holdHelp:'0 = immédiat. La touche ne devient active que si la condition dure aussi longtemps.',fireStart:'Déclencher aussi au démarrage',fireStartHelp:'Exécute la branche « devient actif » si la règle est déjà vraie au démarrage.',st_not_configured:'Non configuré. Saisissez l’adresse et le jeton Home Assistant ci-dessus, puis enregistrez.',st_no_token:'Jeton absent. Saisissez un jeton d’accès longue durée ci-dessus, puis enregistrez.',st_auth_failed:'Authentification refusée. Vérifiez le jeton.',st_reconnecting:'Déconnecté de Home Assistant, reconnexion…',st_connecting:'Connexion à Home Assistant…',st_error:'Liste des entités indisponible.'}};
const AUTO='com.novydeck.homeassistant.auto',SVC='com.novydeck.homeassistant.service';
let ws,context,action='',settings={},items=[],lang='en',noticeTimer,connected=false,listMsg='',stat=null;
const $=id=>document.getElementById(id),t=k=>copy[lang][k]||k,keyFields=['entity','domain','service','data','refresh','attribute','op','value','hold_seconds','fire_at_start'];
function flash(m){$('notice').textContent=m;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',3500);}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));renderStatus();renderFilter();display();suggest();}
function layout(){const auto=action===AUTO;$('autoCard').hidden=!auto;$('serviceCard').hidden=auto;}
function fill(){for(const key of keyFields){if(settings[key]===undefined)continue;const el=$(key);if(el.type==='checkbox')el.checked=!!settings[key];else el.value=settings[key];}if(!$('op').value)$('op').value='eq';suggest();}
function send(event,payload){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event,context,payload}));}
function save(){let refresh=Number($('refresh').value);if(action!==AUTO){if(!$('refresh').value.trim()||!Number.isInteger(refresh)||refresh<2||refresh>300){$('error').textContent=t('invalid');return false;}}else refresh=Number(settings.refresh)||10;$('error').textContent='';let hold=Number($('hold_seconds').value||0);if(action===AUTO){if(!Number.isInteger(hold)||hold<0||hold>86400){$('holdError').textContent=t('invalidHold');return false;}}else hold=settings.hold_seconds;$('holdError').textContent='';const s={...settings};for(const key of keyFields){const el=$(key);s[key]=key==='refresh'?refresh:key==='hold_seconds'?hold:el.type==='checkbox'?el.checked:el.value;}if(action!==AUTO){s.attribute=settings.attribute;s.op=settings.op;s.value=settings.value;s.fire_at_start=settings.fire_at_start;}settings=s;if(ws?.readyState===WebSocket.OPEN){send('setSettings',s);flash(t('saved'));}return true;}
function renderStatus(){const el=$('status');if(!stat){el.textContent=t('offline');return;}const base=stat.connected?t('connected'):(t('st_'+stat.code)!==('st_'+stat.code)?t('st_'+stat.code):t('offline'));el.textContent=base+' · '+(stat.hasToken?t('hasToken'):t('noToken'));}
function setListMsg(){const m=$('listMsg');if(connected){m.textContent=items.length+' '+t('entitiesLoaded');return;}const code=stat&&stat.code;const key='st_'+(code&&code!=='connected'?code:'error');m.textContent=listMsg||t(key);}
function domains(){return[...new Set(items.map(i=>i.domain||i.id.split('.')[0]))].sort();}
function renderFilter(){const f=$('filter'),cur=f.value;f.replaceChildren();const o=document.createElement('option');o.value='';o.textContent=t('all');f.append(o);const list=domains();if(cur&&!list.includes(cur))list.push(cur);for(const d of list){const e=document.createElement('option');e.value=d;e.textContent=d;f.append(e);}f.value=cur;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function display(){const q=norm($('search').value).trim(),dom=$('filter').value,box=$('results');box.replaceChildren();setListMsg();if(!connected)return;let n=0;for(const it of items){if(dom&&(it.domain||it.id.split('.')[0])!==dom)continue;if(q&&!norm(it.id+' '+it.name).includes(q))continue;if(n++>=200)break;const b=document.createElement('button');b.type='button';b.className='result'+(it.id===$('entity').value?' on':'');b.setAttribute('role','option');b.dataset.id=it.id;const nm=document.createElement('span'),id=document.createElement('small'),st=document.createElement('em');nm.textContent=it.name;id.textContent=it.id;st.textContent=it.state===undefined?'':String(it.state)+(it.unit?' '+it.unit:'');b.append(nm,st,id);b.onclick=()=>choose(it);box.append(b);}if(!n){const e=document.createElement('div');e.className='hint';e.textContent=t('noMatch');box.append(e);}}
function choose(it){$('entity').value=it.id;if(action===AUTO&&!$('value').value&&!$('attribute').value&&it.state)$('value').value=it.state;suggest();display();save();}
function suggest(){const dl=$('values');dl.replaceChildren();const it=items.find(i=>i.id===$('entity').value),cur=$('current');cur.textContent='';if(!it)return;const set=new Set();if(!$('attribute').value.trim()){const bin=['on','off'];if(['light','switch','fan','input_boolean','binary_sensor','automation','group'].includes(it.domain)||bin.includes(it.state)){bin.forEach(v=>set.add(v));}if(it.domain==='cover'||it.domain==='lock'||it.domain==='media_player'||it.domain==='person'||it.domain==='device_tracker'){['open','closed','locked','unlocked','playing','paused','idle','home','not_home'].forEach(v=>set.add(v));}if(it.state)set.add(it.state);set.add('unavailable');cur.textContent=t('now')+' : '+it.state+(it.unit?' '+it.unit:'');}for(const v of set){const o=document.createElement('option');o.value=v;dl.append(o);}}
function status(p){stat=p;connected=!!p.connected;if(p.url!==undefined&&document.activeElement!==$('url'))$('url').value=p.url||'';if(p.insecure!==undefined)$('insecure').checked=!!p.insecure;renderStatus();if(connected&&!items.length)send('sendToPlugin',{op:'list'});if(!connected){items=[];listMsg='';}display();}
function connPayload(){return{url:$('url').value.trim(),insecure:$('insecure').checked};}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}try{const a=JSON.parse(actionInfo);context=a.context;action=a.action||'';settings=a.payload?.settings||{};}catch(_){translate();$('notice').textContent=t('missing');return;}layout();translate();fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('getSettings');send('sendToPlugin',{op:'status'});send('sendToPlugin',{op:'list'});};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'){const p=m.payload||{};if(p.type==='status'){status(p);}if(p.type==='list'){if(p.status==='ok'){items=Array.isArray(p.entities)?p.entities:[];connected=true;listMsg='';}else{items=[];connected=false;listMsg=p.message||'';}renderFilter();display();suggest();}if(p.type==='test')flash(p.ok?t('success')+(p.count!==undefined?' ('+p.count+')':''):(p.message||t('error')));if(p.type==='error')flash(p.message||t('error'));}};}
for(const key of keyFields)$(key).addEventListener('change',save);
$('entity').addEventListener('input',()=>{suggest();display();});$('attribute').addEventListener('input',suggest);
$('save').onclick=()=>{const token=$('token').value.trim();$('token').value='';const p={op:'saveConnection',...connPayload()};if(token)p.token=token;send('sendToPlugin',p);items=[];flash(t('requested'));setTimeout(()=>send('sendToPlugin',{op:'list'}),1500);};
$('test').onclick=()=>send('sendToPlugin',{op:'test',...connPayload()});
$('list').onclick=()=>send('sendToPlugin',{op:'list'});$('filter').onchange=display;$('search').oninput=display;
translate();
</script></html>
