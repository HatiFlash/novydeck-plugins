<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Assistant</title><link rel="stylesheet" href="inspector.css">
<h1>Home Assistant</h1><h2 data-i18n="subtitle"></h2>
<section class="card"><h2 data-i18n="connection"></h2><div class="field"><label for="url" data-i18n="url"></label><input id="url" placeholder="http://homeassistant.local:8123"></div><div class="field"><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off"><small data-i18n="tokenHelp"></small></div><div class="toolbar"><button id="save" type="button" data-i18n="saveToken"></button><button id="test" type="button" class="secondary" data-i18n="test"></button></div><small id="status"></small><div class="field"><label class="switch"><input id="insecure" type="checkbox"><span data-i18n="insecure"></span></label><small data-i18n="insecureHelp"></small></div></section>
<section class="card"><h2 data-i18n="entitiesTitle"></h2><div class="field"><label for="filter" data-i18n="filter"></label><select id="filter"><option value="" data-i18n="all"></option><option>light</option><option>switch</option><option>fan</option><option>input_boolean</option><option>cover</option><option>sensor</option><option>scene</option><option>script</option><option>media_player</option></select></div><button id="list" type="button" data-i18n="list"></button><div class="field"><label for="search" data-i18n="search"></label><input id="search"></div><div class="field"><label for="entities" data-i18n="entities"></label><select id="entities"><option value=""></option></select></div><div class="field"><label for="entity" data-i18n="entity"></label><input id="entity" placeholder="light.salon"><small data-i18n="manual"></small></div></section>
<section class="card"><h2 data-i18n="serviceTitle"></h2><div class="field"><label for="domain" data-i18n="domain"></label><input id="domain" placeholder="light"></div><div class="field"><label for="service" data-i18n="service"></label><input id="service" placeholder="turn_on"></div><div class="field"><label for="data" data-i18n="data"></label><textarea id="data" rows="4" placeholder='{"brightness": 128}'></textarea></div><div class="field"><label for="refresh" data-i18n="refresh"></label><input id="refresh" type="number" min="2" max="300" step="1" value="10"><div id="error" class="error" role="alert"></div></div><small data-i18n="serviceHelp"></small></section><div id="notice" role="status"></div>
<script>
const copy={en:{subtitle:'Action settings',connection:'Connection',url:'Home Assistant address',token:'Long-lived access token',tokenHelp:'Encrypted under your Windows account. Never returned to the inspector.',saveToken:'Save token',test:'Test connection',insecure:'Allow self-signed certificates',insecureHelp:'Unsafe: disables TLS certificate validation.',entitiesTitle:'Entities',filter:'Domain filter',all:'All',list:'Load entities',search:'Search',entities:'Select entity',choose:'Select',entity:'Entity ID',manual:'You can also enter an ID manually.',serviceTitle:'Call a service',domain:'Service domain',service:'Service',data:'Service data (JSON object)',refresh:'Refresh interval (seconds)',serviceHelp:'Service fields apply to the “Call service” action. Test checks GET /api/.',invalid:'Enter a whole number from 2 to 300.',missing:'Configuration unavailable',connected:'Connected',offline:'Not configured',hasToken:'Token saved',noToken:'Token missing or unreadable',success:'Connection successful',error:'Error',loaded:'entities loaded',requested:'Save requested',saved:'Saved'},fr:{subtitle:'Réglages de l’action',connection:'Connexion',url:'Adresse Home Assistant',token:'Jeton d’accès longue durée',tokenHelp:'Chiffré sous votre compte Windows. Jamais renvoyé à l’inspecteur.',saveToken:'Enregistrer le jeton',test:'Tester la connexion',insecure:'Accepter les certificats auto-signés',insecureHelp:'Dangereux : désactive la vérification TLS.',entitiesTitle:'Entités',filter:'Filtre de domaine',all:'Tous',list:'Charger les entités',search:'Rechercher',entities:'Choisir une entité',choose:'Sélectionner',entity:'ID de l’entité',manual:'Vous pouvez aussi saisir un ID manuellement.',serviceTitle:'Appeler un service',domain:'Domaine du service',service:'Service',data:'Données du service (objet JSON)',refresh:'Actualisation (secondes)',serviceHelp:'Les champs service concernent l’action « Appeler un service ». Tester vérifie GET /api/.',invalid:'Saisissez un entier entre 2 et 300.',missing:'Configuration indisponible',connected:'Connecté',offline:'Non configuré',hasToken:'Jeton enregistré',noToken:'Jeton absent ou non lisible',success:'Connexion réussie',error:'Erreur',loaded:'entités chargées',requested:'Enregistrement demandé',saved:'Enregistré'}};
let ws,context,settings={},items=[],lang='en',noticeTimer;const $=id=>document.getElementById(id),fields=['url','entity','domain','service','data','refresh','insecure'];
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);$('status').textContent=copy[lang].offline;display();}
function fill(){for(const key of fields)if(settings[key]!==undefined)$(key)[key==='insecure'?'checked':'value']=settings[key];}
function send(event,payload){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event,context,payload}));}
function save(){const refresh=Number($('refresh').value);if(!$('refresh').value.trim()||!Number.isInteger(refresh)||refresh<2||refresh>300){$('error').textContent=copy[lang].invalid;return false;}$('error').textContent='';const s={};for(const key of fields)s[key]=key==='insecure'?$(key).checked:key==='refresh'?refresh:$(key).value;settings=s;if(ws?.readyState===WebSocket.OPEN){send('setSettings',s);$('notice').textContent=copy[lang].saved;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',2500);}return true;}
function display(){const query=$('search').value.toLowerCase(),domain=$('filter').value,select=$('entities');select.replaceChildren();const first=document.createElement('option');first.value='';first.textContent=copy[lang].choose;select.append(first);for(const item of items){if(domain&&!item.id.startsWith(domain+'.'))continue;if(query&&!(item.id+' '+item.name).toLowerCase().includes(query))continue;const opt=document.createElement('option');opt.value=item.id;opt.textContent=item.name+' ('+item.id+')';select.append(opt);}select.value=$('entity').value;}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(_){$('notice').textContent=copy[lang].missing;return;}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('getSettings');send('sendToPlugin',{op:'status'});};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'){const p=m.payload||{};if(p.type==='status'){$('status').textContent=p.connected?copy[lang].connected:copy[lang].offline;$('notice').textContent=p.connected?copy[lang].hasToken:copy[lang].noToken;}if(p.type==='test')$('notice').textContent=copy[lang].success;if(p.type==='error')$('notice').textContent=p.message||copy[lang].error;if(p.type==='entities'){items=Array.isArray(p.items)?p.items:[];display();$('notice').textContent=items.length+' '+copy[lang].loaded;}}};}
for(const key of fields)$(key).addEventListener('change',save);
$('save').onclick=()=>{const token=$('token').value.trim();$('token').value='';if(token){send('sendToPlugin',{op:'saveToken',token});$('notice').textContent=copy[lang].requested;}};
$('test').onclick=()=>{if(save())send('sendToPlugin',{op:'test',settings});};$('list').onclick=()=>{if(save())send('sendToPlugin',{op:'list',settings});};$('filter').onchange=display;$('search').oninput=display;$('entities').onchange=()=>{if($('entities').value){$('entity').value=$('entities').value;save();}};translate();
</script></html>
