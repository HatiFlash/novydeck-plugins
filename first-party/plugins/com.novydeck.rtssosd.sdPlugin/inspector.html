<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RivaTuner OSD</title><link rel="stylesheet" href="inspector.css">
<h1 data-i18n="title"></h1><h2 data-i18n="subtitle"></h2><section class="card"><div class="field"><label for="mode" data-i18n="mode"></label><select id="mode"><option value="toggle" data-i18n="toggle"></option><option value="on" data-i18n="on"></option><option value="off" data-i18n="off"></option></select><small data-i18n="help"></small></div></section><div id="notice" role="status"></div>
<script>
const copy={en:{title:'RivaTuner OSD',subtitle:'Action settings',mode:'On press',toggle:'Toggle',on:'ON — show the overlay',off:'OFF — hide the overlay',help:'Controls the RivaTuner Statistics Server overlay directly, without simulating keys. RivaTuner Statistics Server must be installed and running. The key shows the real overlay state, also when changed by keyboard.',saved:'Saved',ok:'Done',notFound:'RivaTuner Statistics Server not found',notRunning:'RivaTuner is not running',invalidMode:'Invalid mode'},fr:{title:'Overlay RivaTuner',subtitle:'Réglages de l’action',mode:'À l’appui',toggle:'Basculer',on:'ON — afficher l’overlay',off:'OFF — masquer l’overlay',help:'Pilote directement l’overlay de RivaTuner Statistics Server, sans simuler de touches. RivaTuner Statistics Server doit être installé et lancé. La touche reflète l’état réel de l’overlay, même modifié au clavier.',saved:'Enregistré',ok:'Fait',notFound:'RivaTuner Statistics Server introuvable',notRunning:'RivaTuner n’est pas lancé',invalidMode:'Mode invalide'}};
let ws,context,settings={},lang='en',noticeTimer;const $=id=>document.getElementById(id);
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);}
function fill(){$('mode').value=['on','off','toggle'].includes(settings.mode)?settings.mode:'toggle';}
function say(text){$('notice').textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',3500);}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(e){console.error(e);}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'){const s=m.payload?.status;if(s&&s!=='ready'&&copy[lang][s])say(copy[lang][s]);}};}
function save(){settings={...settings,mode:$('mode').value};if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));say(copy[lang].saved);}}
$('mode').addEventListener('change',save);translate();
</script></html>
