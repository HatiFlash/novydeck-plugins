<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLED Saver</title><link rel="stylesheet" href="inspector.css">
<h1 data-i18n="title"></h1><h2 data-i18n="subtitle"></h2><section class="card"><h2 data-i18n="display"></h2><div class="field" role="radiogroup" aria-labelledby="screensLabel"><label id="screensLabel" data-i18n="screens"></label><label class="switch"><input type="radio" name="scope" value="others"><span data-i18n="others"></span></label><label class="switch"><input type="radio" name="scope" value="all"><span data-i18n="all"></span></label><label class="switch"><input type="radio" name="scope" value="choose"><span data-i18n="choose"></span></label><div id="screens" class="sub"></div></div><div class="field"><label for="mode" data-i18n="mode"></label><select id="mode"><option value="toggle" data-i18n="toggle"></option><option value="on" data-i18n="on"></option><option value="off" data-i18n="off"></option></select></div><div class="field"><label class="switch"><input id="closeOnMove" type="checkbox"><span data-i18n="close"></span></label><small data-i18n="help"></small></div><div class="field"><label class="switch"><input id="keepFocus" type="checkbox"><span data-i18n="focus"></span></label><small data-i18n="focusHelp"></small></div></section><div id="notice" role="status"></div>
<script>
const copy={en:{title:'OLED Saver',subtitle:'Action settings',display:'Display',screens:'Screens to cover',others:'All except the main screen (recommended for cinema mode)',all:'All screens',choose:'Choose',main:'main',pick:'Tick at least one screen.',mode:'On press',toggle:'Toggle',on:'ON — hide',off:'OFF — uncover',close:'Close on mouse movement',help:'Cinema mode: use ON in state 1 and OFF in state 2. OFF closes the chosen screens even if another key opened them, and even if the screen order changed. Does not power off the monitor.',focus:'Keep focus on the video (keyboard does not close)',focusHelp:'The overlay does not take focus: keyboard input is not captured and does not close it; a click still does.',saved:'Saved'},fr:{title:'Veille OLED',subtitle:'Réglages de l’action',display:'Écran',screens:'Écrans à masquer',others:'Tous sauf l’écran principal (recommandé pour le mode cinéma)',all:'Tous les écrans',choose:'Choisir',main:'principal',pick:'Cochez au moins un écran.',mode:'À l’appui',toggle:'Basculer',on:'ON — masquer',off:'OFF — découvrir',close:'Fermer au mouvement de la souris',help:'Mode cinéma : utilisez ON dans l’état 1 et OFF dans l’état 2. OFF ferme les écrans choisis même si une autre touche les a ouverts et même si l’ordre des écrans a changé. Le moniteur reste allumé.',focus:'Garder le focus sur la vidéo (ne pas fermer au clavier)',focusHelp:'La fenêtre ne prend pas le focus : le clavier n’est pas capturé et ne la ferme pas ; un clic la ferme toujours.',saved:'Enregistré'}};
let ws,context,settings={},screens=[],lang='en',noticeTimer;const $=id=>document.getElementById(id);
const scope=()=>document.querySelector('input[name=scope]:checked')?.value;
const same=(w,m)=>w.name===m.name&&w.x===m.x&&w.y===m.y&&w.w===m.width&&w.h===m.height||w.x===m.x&&w.y===m.y&&w.w===m.width&&w.h===m.height||w.name===m.name||w.index===m.index;
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);drawScreens();}
function chosen(m){if(Array.isArray(settings.monitors)&&settings.monitors.length)return settings.monitors.some(w=>same(w,m));if(settings.monitor==='others'||settings.monitor==='all')return false;return Number(settings.monitor??0)===m.index;}
function drawScreens(){const box=$('screens');const keep=new Map([...box.querySelectorAll('input')].map(i=>[i.value,i.checked]));box.replaceChildren();for(const m of screens){const label=document.createElement('label');label.className='switch';const input=document.createElement('input');input.type='checkbox';input.value=String(m.index);input.checked=keep.has(input.value)?keep.get(input.value):chosen(m);input.addEventListener('change',save);const span=document.createElement('span');span.textContent=`${m.name} (${m.width} × ${m.height})`;if(m.primary){const badge=document.createElement('em');badge.className='badge';badge.textContent=copy[lang].main;span.append(' ',badge);}label.append(input,span);box.append(label);}syncScope();}
function syncScope(){const choose=scope()==='choose';for(const i of $('screens').querySelectorAll('input'))i.disabled=!choose;}
function fill(){const s=Array.isArray(settings.monitors)&&settings.monitors.length?'choose':settings.monitor==='others'?'others':settings.monitor==='all'?'all':'choose';document.querySelector(`input[name=scope][value=${s}]`).checked=true;$('screens').replaceChildren();drawScreens();$('mode').value=['on','off','toggle'].includes(settings.mode)?settings.mode:'toggle';$('closeOnMove').checked=settings.closeOnMove===true;$('keepFocus').checked=settings.keepFocus===true;}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(e){console.error(e);}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'&&Array.isArray(m.payload?.monitors)){screens=m.payload.monitors;fill();}};}
function say(text){$('notice').textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',2500);}
function save(){const next={...settings,mode:$('mode').value,closeOnMove:$('closeOnMove').checked,keepFocus:$('keepFocus').checked};const s=scope();syncScope();
if(s==='choose'){const picked=[...$('screens').querySelectorAll('input:checked')].map(i=>screens.find(m=>String(m.index)===i.value)).filter(Boolean);if(!picked.length){say(copy[lang].pick);return;}next.monitors=picked.map(m=>({name:m.name,index:m.index,x:m.x,y:m.y,w:m.width,h:m.height}));next.monitor=picked[0].index;}
else{delete next.monitors;next.monitor=s;}
settings=next;if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));say(copy[lang].saved);}}
for(const id of ['mode','closeOnMove','keepFocus'])$(id).addEventListener('change',save);for(const r of document.querySelectorAll('input[name=scope]'))r.addEventListener('change',save);translate();
</script></html>
