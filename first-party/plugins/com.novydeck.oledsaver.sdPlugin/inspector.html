<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLED Saver</title><link rel="stylesheet" href="inspector.css">
<h1 data-i18n="title"></h1><h2 data-i18n="subtitle"></h2><section class="card"><h2 data-i18n="display"></h2><div class="field"><label for="monitor" data-i18n="monitor"></label><select id="monitor"><option value="all" data-i18n="all"></option><option value="0" data-i18n="primary"></option></select></div><div class="field"><label for="mode" data-i18n="mode"></label><select id="mode"><option value="toggle" data-i18n="toggle"></option><option value="on" data-i18n="on"></option><option value="off" data-i18n="off"></option></select></div><div class="field"><label class="switch"><input id="closeOnMove" type="checkbox"><span data-i18n="close"></span></label><small data-i18n="help"></small></div><div class="field"><label class="switch"><input id="keepFocus" type="checkbox"><span data-i18n="focus"></span></label><small data-i18n="focusHelp"></small></div></section><div id="notice" role="status"></div>
<script>
const copy={en:{title:'OLED Saver',subtitle:'Action settings',display:'Display',monitor:'Monitor',all:'All screens',primary:'Primary',mode:'On press',toggle:'Toggle',on:'ON — hide',off:'OFF — uncover',close:'Close on mouse movement',help:'Cinema mode: use ON in state 1 and OFF in state 2. OFF closes the chosen screen(s) even if another key opened them, and even if the screen order changed. Does not power off the monitor.',focus:'Keep focus on the video (keyboard does not close)',focusHelp:'The overlay does not take focus: keyboard input is not captured and does not close it; a click still does.',saved:'Saved'},fr:{title:'Veille OLED',subtitle:'Réglages de l’action',display:'Écran',monitor:'Moniteur',all:'Tous les écrans',primary:'Principal',mode:'À l’appui',toggle:'Basculer',on:'ON — masquer',off:'OFF — découvrir',close:'Fermer au mouvement de la souris',help:'Mode cinéma : utilisez ON dans l’état 1 et OFF dans l’état 2. OFF ferme l’écran choisi (ou tous) même si une autre touche l’a ouvert et même si l’ordre des écrans a changé. Le moniteur reste allumé.',focus:'Garder le focus sur la vidéo (ne pas fermer au clavier)',focusHelp:'La fenêtre ne prend pas le focus : le clavier n’est pas capturé et ne la ferme pas ; un clic la ferme toujours.',saved:'Enregistré'}};
let ws,context,settings={},lang='en',noticeTimer;const $=id=>document.getElementById(id);
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);}
function fill(){const monitor=String(settings.monitor??0);if([...$('monitor').options].some(opt=>opt.value===monitor))$('monitor').value=monitor;$('mode').value=['on','off','toggle'].includes(settings.mode)?settings.mode:'toggle';$('closeOnMove').checked=settings.closeOnMove===true;$('keepFocus').checked=settings.keepFocus===true;}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(e){console.error(e);}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'&&Array.isArray(m.payload?.monitors)){const select=$('monitor');select.replaceChildren();const all=document.createElement('option');all.value='all';all.textContent=copy[lang].all;select.append(all);for(const item of m.payload.monitors){const option=document.createElement('option');option.value=String(item.index);option.textContent=`${item.name} (${item.width} × ${item.height})`;select.append(option);}fill();}};}
function save(){settings={...settings,monitor:$('monitor').value==='all'?'all':Number($('monitor').value),mode:$('mode').value,closeOnMove:$('closeOnMove').checked,keepFocus:$('keepFocus').checked};if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));$('notice').textContent=copy[lang].saved;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',2500);}}
for(const id of ['monitor','mode','closeOnMove','keepFocus'])$(id).addEventListener('change',save);translate();
</script></html>
