<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalRGB lighting</title><link rel="stylesheet" href="inspector.css">
<h1>SignalRGB</h1><section class="card"><label for="mode" data-i18n="mode"></label><select id="mode"><option value="" data-i18n="choose"></option><option value="off" data-i18n="off"></option><option value="on" data-i18n="on"></option></select><small data-i18n="help"></small></section><p id="message" role="status"></p>
<script>
const copy={en:{mode:'On press',choose:'Choose an action',off:'OFF — send black to canvas',on:'ON — enable canvas',help:'Global to all SignalRGB lighting. SignalRGB must be running locally. OFF sends black; it does not physically cut power to LEDs. No toggle or remote host is supported.'},fr:{mode:'À l’appui',choose:'Choisir une action',off:'OFF — envoyer du noir au canvas',on:'ON — activer le canvas',help:'Agit sur tout l’éclairage SignalRGB. SignalRGB doit fonctionner sur ce PC. OFF envoie du noir, sans couper l’alimentation des LED. Ni bascule ni hôte distant.'}};
let lang='en',settings={},context,ws;const $=id=>document.getElementById(id);
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);}
function fill(){$('mode').value=['on','off'].includes(settings.mode)?settings.mode:'';}
function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{const a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(e){console.error(e);}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill();}if(m.event==='sendToPropertyInspector'&&m.payload?.type==='message')$('message').textContent=m.payload.message;};}
$('mode').addEventListener('change',()=>{settings={...settings,mode:$('mode').value};if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));});translate();
</script></html>
