let lang='en',ws,context,settings={},homes=[];const $=id=>document.getElementById(id);function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=copy[lang][e.dataset.i18n]);$('status').textContent=copy[lang].offline;}function emit(type,extra={}){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'sendToPlugin',context,payload:{type,...extra}}));}function options(el,items,key){el.replaceChildren();items.forEach(item=>{let o=document.createElement('option');o.value=item.id;o.textContent=item.name||item.id;el.append(o)});if(key)el.value=key;}function targets(){let home=homes.find(h=>h.id===$('home').value);options($('target'),home?.[$('scope').value==='room'?'rooms':'devices']||[],settings.target);}function fill(){for(let k of ['scope','mode','brightness'])$(k).value=settings[k]??({scope:'device',mode:'on',brightness:50}[k]);options($('home'),homes,settings.home);targets();}function save(){settings={home:$('home').value,scope:$('scope').value,target:$('target').value,mode:$('mode').value,brightness:Number($('brightness').value)};if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));}function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{let a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(_){}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));emit('status');};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill()}if(m.event==='sendToPropertyInspector'){let p=m.payload||{};if(p.type==='status')$('status').textContent=p.connected?copy[lang].online:copy[lang].offline;i
