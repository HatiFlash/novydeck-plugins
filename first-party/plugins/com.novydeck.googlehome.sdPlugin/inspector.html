const copy={en:{title:'Google Home',intro:'Control devices or a room directly with the unofficial Google Home private API.',login:'Connect your account',warning:'Unofficial API: may stop working. The oauth_token grants broad access to your account. Use only your own account and never share the token.',email:'Google account email',token:'One-time oauth_token',tokenHelp:'Visit accounts.google.com/EmbeddedSetup in your browser and paste the oauth2_4/ token here. It is sent once to the plugin, exchanged, and only the encrypted master token is retained with Windows DPAPI. Never stored in button settings.',connect:'Connect',disconnect:'Disconnect',offline:'Not connected',online:'Connected',control:'Configure button',refresh:'Refresh homes and devices',home:'Home',scope:'Control',device:'Device',room:'Room (all compatible devices)',group:'Group (selected devices)',target:'Target',addDevice:'Add device',groupHelp:'Select 1–20 devices from this home. Toggle: all ON → all OFF; otherwise all ON. A missing state prevents every write.',remove:'Remove',groupLimit:'Maximum 20 devices',groupDuplicate:'Device already added',mode:'When pressed',on:'Turn on',off:'Turn off',toggle:'Toggle ON/OFF',brightness:'Set brightness',level:'Brightness (%)',capability:'Toggle reads the current on/off state on each press. For a room: all on → turn all off; otherwise turn all on. If any device is unsupported, its state is unknown, or the read fails, nothing is sent. The key image is not a live state indicator.'},fr:{title:'Google Home',intro:'Pilotez un appareil ou une pièce via l’API privée non officielle de Google Home.',login:'Connecter le compte',warning:'API non officielle : elle peut cesser de fonctionner. Le jeton oauth_token donne un accès étendu au compte. Utilisez uniquement votre compte ; ne partagez jamais ce jeton.',email:'Adresse du compte Google',token:'Jeton oauth_token à usage unique',tokenHelp:'Ouvrez accounts.google.com/EmbeddedSetup dans votre navigateur et collez ici le jeton oauth2_4/. Il est envoyé une seule fois au plugin ; seul le jeton maître chiffré DPAPI est ensuite conservé. Jamais dans les réglages de touche.',connect:'Se connecter',disconnect:'Déconnecter',offline:'Non connecté',online:'Connecté',control:'Configurer la touche',refresh:'Actualiser maisons et appareils',home:'Maison',scope:'Commander',device:'Appareil',room:'Pièce (tous les appareils compatibles)',group:'Groupe (appareils choisis)',target:'Cible',addDevice:'Ajouter un appareil',groupHelp:'Sélectionnez 1 à 20 appareils de cette maison. Bascule : tous allumés → tout éteindre ; sinon tout allumer. Un état manquant bloque tout envoi.',remove:'Retirer',groupLimit:'Maximum 20 appareils',groupDuplicate:'Appareil déjà ajouté',mode:'À l’appui',on:'Allumer',off:'Éteindre',toggle:'Basculer ON/OFF',brightness:'Régler la luminosité',level:'Luminosité (%)',capability:'La bascule lit l’état marche/arrêt réel à chaque appui. Pièce : tous allumés → tout éteindre ; sinon tout allumer. Appareil incompatible, état inconnu ou lecture en échec : aucun envoi. L’image de la touche n’indique pas l’état en direct.'}};
let lang='en',ws,context,settings={},homes=[];const $=id=>document.getElementById(id);function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=copy[lang][e.dataset.i18n]);$('status').textContent=copy[lang].offline;}function emit(type,extra={}){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'sendToPlugin',context,payload:{type,...extra}}));}function options(el,items,key){el.replaceChildren();items.forEach(item=>{let o=document.createElement('option');o.value=item.id;o.textContent=item.name||item.id;el.append(o)});if(key)el.value=key;}function targets(){let home=homes.find(h=>h.id===$('home').value);options($('target'),home?.[$('scope').value==='room'?'rooms':'devices']||[],settings.target);options($('candidate'),home?.devices||[]);renderGroup();}function renderGroup(){let home=homes.find(h=>h.id===$('home').value),devices=home?.devices||[];$('selected').replaceChildren();for(let id of Array.isArray(settings.targets)?settings.targets:[]){let row=document.createElement('div');row.className='toolbar';let label=document.createElement('span');label.textContent=devices.find(d=>d.id===id)?.name||id;let button=document.createElement('button');button.type='button';button.textContent='−';button.title=copy[lang].remove;button.setAttribute('aria-label',copy[lang].remove+' '+label.textContent);button.onclick=()=>{settings.targets=settings.targets.filter(x=>x!==id);save()};row.append(label,button);$('selected').append(row)}}function visibility(){$('brightness-fields').hidden=$('mode').value!=='brightness';$('group-fields').hidden=$('scope').value!=='group';$('single-fields').hidden=$('scope').value==='group';$('add').setAttribute('aria-label',copy[lang].addDevice);}function fill(){for(let k of ['scope','mode','brightness'])$(k).value=settings[k]??({scope:'device',mode:'on',brightness:50}[k]);options($('home'),homes,settings.home);targets();visibility();}function save(){visibility();settings={home:$('home').value,scope:$('scope').value,target:$('target').value,targets:Array.isArray(settings.targets)?settings.targets:[],mode:$('mode').value,brightness:Number($('brightness').value)};renderGroup();if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({event:'setSettings',context,payload:settings}));}function connectElgatoStreamDeckSocket(port,uuid,registerEvent,info,actionInfo){try{lang=JSON.parse(info).application.language==='fr'?'fr':'en';}catch(_){}translate();try{let a=JSON.parse(actionInfo);context=a.context;settings=a.payload?.settings||{};}catch(_){}fill();ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));ws.send(JSON.stringify({event:'getSettings',context}));emit('status');};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.context!==context)return;if(m.event==='didReceiveSettings'){settings=m.payload?.settings||{};fill()}if(m.event==='sendToPropertyInspector'){let p=m.payload||{};if(p.type==='status')$('status').textContent=p.connected?copy[lang].online:copy[lang].offline;if(p.type==='message')$('message').textContent=p.message||'';if(p.type==='homes'){homes=Array.isArray(p.homes)?p.homes:[];fill()}}};}for(let k of ['home','scope','target','mode','brightness'])$(k).addEventListener('change',()=>{if(k==='home'||k==='scope'){settings.target='';if(k==='home')settings.targets=[];targets()}save()});$('add').onclick=()=>{let id=$('candidate').value,device=homes.find(h=>h.id===$('home').value)?.devices?.find(d=>d.id===id);let ids=Array.isArray(settings.targets)?settings.targets:[];if(!device)return;if(ids.includes(id)){$('message').textContent=copy[lang].groupDuplicate;return}if(ids.length>=20){$('message').textContent=copy[lang].groupLimit;return}settings.targets=[...ids,id];$('message').textContent='';save()};$('connect').onclick=()=>{try{emit('connect',{email:$('email').value,token:$('token').value})}finally{$('token').value=''}};$('disconnect').onclick=()=>emit('disconnect');$('refresh').onclick=()=>emit('list');translate();
</script></html>
