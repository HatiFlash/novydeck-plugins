[package]
name = "novydeck-googlehome"
version = "1.0.4"
edition.workspace = true
license.workspace = true

[dependencies]
novydeck-sdk.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
rand = "0.8"
